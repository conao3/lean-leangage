[project]
name = "leanharbor"
version = "0.1.0"
description = "The trusted shell that runs a Lean-proved kernel behind HTTP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["leanfran==0.8.0"]

[project.scripts]
leanharbor-calculator = "leanharbor_calculator.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-icdiff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leanharbor", "src/leanharbor_calculator"]

[tool.pytest.ini_options]
testpaths = ["test"]

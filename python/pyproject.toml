[project]
name = "leangage"
version = "0.1.0"
description = "The trusted server that runs a Lean-proved kernel behind HTTP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "leanfran==0.13.2",
    "psycopg[binary]>=3.2",
]

[project.scripts]
leangage-calculator = "leangage_calculator.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-icdiff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leangage", "src/leangage_calculator", "src/leangage_notes"]

[tool.pytest.ini_options]
testpaths = ["test"]

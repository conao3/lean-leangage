name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.1.0
      - run: nix develop --command make format-check generated-check handlers
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, go]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.1.0
      - run: nix develop --command make test-${{ matrix.language }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.1.0
      - run: nix build

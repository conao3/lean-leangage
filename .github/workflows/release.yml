name: Release
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: release
env:
  PACKAGE: leangage
  CRATES: leangage leangage-pg
  VERSION_FILES: rust/Cargo.toml rust/leangage-pg/Cargo.toml rust/Cargo.lock flake.nix python/pyproject.toml python/uv.lock
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch the release workflow from $DEFAULT_BRANCH."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
      - name: Choose version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(nix develop --command uv --directory python version --bump "$BUMP" --dry-run --short)
          for tag in "v$version" "go/v$version"; do
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")
            if [[ "$existing" != 0 ]]; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix develop --command tools/bump-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          read -ra files <<< "$VERSION_FILES"
          git commit -m "Bump version to $VERSION" -- "${files[@]}"
      - name: Generate the Rust and the Python code
        run: nix develop --command make generate-rust generate-python
      - name: Verify the committed Go code
        run: nix develop --command make generated-check
      - name: Verify crates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The working tree differs from the version commit."
            exit 1
          fi
          read -ra crates <<< "$CRATES"
          nix develop --command cargo publish --manifest-path rust/Cargo.toml --locked --allow-dirty --dry-run "${crates[@]/#/--package=}"
      - name: Verify package
        run: |
          nix develop --command uv --directory python build
          nix develop --command uv publish --dry-run --trusted-publishing never python/dist/*
      - name: Bundle the version commit
        run: git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..HEAD"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle
          retention-days: 1

  tag:
    name: Push commit and tag
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}
      - name: Push commit and tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git fetch "$RUNNER_TEMP/release.bundle" HEAD
          commit=$(git rev-parse FETCH_HEAD)
          if [[ "$(git rev-parse "$commit^")" != "$GITHUB_SHA" ]]; then
            echo "::error::The version commit is not a child of $GITHUB_SHA."
            exit 1
          fi
          read -ra allowed <<< "$VERSION_FILES"
          while read -r file; do
            if [[ " ${allowed[*]} " != *" $file "* ]]; then
              echo "::error::The version commit changes $file."
              exit 1
            fi
          done < <(git diff --name-only "$GITHUB_SHA" "$commit")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$PACKAGE v$VERSION" "$commit"
          git tag -a "go/v$VERSION" -m "$PACKAGE v$VERSION" "$commit"
          git push --atomic origin "$commit:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION" "refs/tags/go/v$VERSION"

  publish-crates:
    name: Publish to crates.io
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
      - name: Generate the Rust code
        run: |
          nix develop --command make generate-rust
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The working tree differs from the tag."
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for crate in $CRATES; do
            if curl -sf -A "$PACKAGE-release/1" "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
              echo "$crate $VERSION is already published"
            else
              nix develop --command cargo publish --manifest-path rust/Cargo.toml -p "$crate" --locked --allow-dirty
            fi
          done

  publish-pypi:
    name: Publish to PyPI
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PACKAGE }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v${{ needs.check.outputs.version }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
      - name: Generate the Python code
        run: nix develop --command make generate-python
      - name: Build package
        run: nix develop --command uv --directory python build
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: python/dist
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [check, publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$PACKAGE v$VERSION" --generate-notes

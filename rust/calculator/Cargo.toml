[package]
name = "leangage-calculator"
description = "The calculator kernel, generated from Lean, behind the leangage server"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
leanfran = "=0.13.2"
leangage = { path = "../leangage" }
leangage-notes = { path = "../notes" }
hmac = "0.13"
sha2 = "0.10"
leangage-pg = { path = "../leangage-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tokio-postgres = "0.7"

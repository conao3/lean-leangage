[package]
name = "leanharbor-calculator"
description = "The calculator kernel, generated from Lean, behind the leanharbor shell"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
leanfran = "=0.11.0"
leanharbor = { path = "../leanharbor" }
leanharbor-notes = { path = "../notes" }
hmac = "0.12"
sha2 = "0.10"
leanharbor-pg = { path = "../leanharbor-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tokio-postgres = "0.7"

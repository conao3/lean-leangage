[package]
name = "leanharbor-notes"
description = "The notes kernel and its policy, generated from Lean, behind the leanharbor shell"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
leanfran = "=0.11.0"
leanharbor = { path = "../leanharbor" }
leanharbor-pg = { path = "../leanharbor-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tokio-postgres = "0.7"
tower = { version = "0.5", features = ["util"] }

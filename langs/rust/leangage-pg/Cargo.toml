[package]
name = "leangage-pg"
description = "The engine that stores a Lean-proved kernel's snapshots in PostgreSQL"
readme = "README.md"
include = ["src/**/*.rs", "README.md"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
leanfran = "=0.13.2"
leangage = { path = "../leangage", version = "0.1.2" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util", "sync"] }
tokio-postgres = "0.7"

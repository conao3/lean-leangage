[package]
name = "leanharbor-bench-baselines"
description = "Servers without a kernel that the HTTP measurement compares leanharbor with"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
actix-web = "4"
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[profile.release]
debug = 1

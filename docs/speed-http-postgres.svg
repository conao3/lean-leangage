<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 338" width="860" height="338" role="img"><title>POST /rpc over HTTP, Rust, stored in PostgreSQL</title><style>text{font-family:system-ui,sans-serif;font-size:12px;fill:#24292f}.title{font-size:14px;font-weight:600}.grid{stroke:#d0d7de}.axis{fill:#57606a}@media(prefers-color-scheme:dark){text{fill:#e6edf3}.grid{stroke:#30363d}.axis{fill:#8b949e}}</style><text class="title" x="150" y="20">POST /rpc over HTTP, Rust, stored in PostgreSQL</text><rect x="150" y="34" width="12" height="12" fill="#4477aa"/><text x="168" y="44">leangage, Rust (axum), PostgreSQL engine</text><rect x="150" y="52" width="12" height="12" fill="#ee6677"/><text x="168" y="62">axum and tokio-postgres, no kernel</text><line class="grid" x1="150.0" y1="94" x2="150.0" y2="290"/><text class="axis" x="150.0" y="306" text-anchor="middle">0</text><line class="grid" x1="250.0" y1="94" x2="250.0" y2="290"/><text class="axis" x="250.0" y="306" text-anchor="middle">5,000</text><line class="grid" x1="350.0" y1="94" x2="350.0" y2="290"/><text class="axis" x="350.0" y="306" text-anchor="middle">10,000</text><line class="grid" x1="450.0" y1="94" x2="450.0" y2="290"/><text class="axis" x="450.0" y="306" text-anchor="middle">15,000</text><line class="grid" x1="550.0" y1="94" x2="550.0" y2="290"/><text class="axis" x="550.0" y="306" text-anchor="middle">20,000</text><line class="grid" x1="650.0" y1="94" x2="650.0" y2="290"/><text class="axis" x="650.0" y="306" text-anchor="middle">25,000</text><line class="grid" x1="750.0" y1="94" x2="750.0" y2="290"/><text class="axis" x="750.0" y="306" text-anchor="middle">30,000</text><text class="axis" x="150" y="326">Replies per second; higher is better</text><rect x="150" y="100" width="96.8" height="14" fill="#4477aa"/><text x="252.8" y="111">4,840</text><rect x="150" y="117" width="87.8" height="14" fill="#ee6677"/><text x="243.8" y="128">4,390</text><text x="140" y="119" text-anchor="end">get, 1 connection</text><rect